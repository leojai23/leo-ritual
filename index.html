<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4607a">
<meta name="description" content="Leo-Ritual — daily habit tracker with streaks and best-practice guides for Exercise, Breathing Exercise, Twin Heart Meditation, and Oil Pulling.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Leo-Ritual</title>
<style>
:root{
  --bg:#f7f4f1; --bg-2:#fffdfb; --panel:#ffffff; --ink:#2b2724; --ink-soft:#6b625c;
  --line:#e8e0d8; --accent:#b4607a; --accent-ink:#fff;
  --chip:#f3e8ec; --chip-ink:#8a3f58; --good:#3f9142; --good-bg:#e7f3e7;
  --warn:#c94f4f; --warn-bg:#fbeaea; --mid:#c98a2f; --mid-bg:#f7edd9;
  --shadow:0 1px 3px rgba(40,30,30,.08),0 8px 24px rgba(40,30,30,.06);
  --maxw:48rem;
}
[data-theme="dark"]{
  --bg:#1b1718; --bg-2:#221d1e; --panel:#282224; --ink:#ece6e3; --ink-soft:#ab9f9a;
  --line:#3a3335; --accent:#d98aa0; --accent-ink:#1b1718;
  --chip:#332228; --chip-ink:#e3a9ba; --good:#6fbf73; --good-bg:#1c2b1e;
  --warn:#e08080; --warn-bg:#332020; --mid:#e0ac5c; --mid-bg:#332a1a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent); text-decoration:none}
button{font:inherit}
input,textarea,select{font:inherit; color:inherit}

.app{display:flex; min-height:100vh}
.sidebar{
  width:14.5rem; flex:0 0 14.5rem; background:var(--bg-2); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:1rem .6rem 4rem;
}
.side-head{display:flex; align-items:center; gap:.6rem; padding:.4rem .6rem 1.1rem}
.side-head .logo{
  width:2.1rem;height:2.1rem;border-radius:50%;flex:0 0 2.1rem;
  background:radial-gradient(circle at center, var(--bg-2) 0 18%, var(--accent) 20% 34%, var(--bg-2) 36% 52%, var(--accent) 54% 100%);
  border:1px solid var(--line);
}
.side-head b{font-size:1.05rem}
.side-head small{display:block; color:var(--ink-soft); font-size:.74rem; font-weight:500}

nav.tabs{display:flex; flex-direction:column; gap:.15rem; font-size:.92rem}
nav.tabs button{
  display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; background:none; border:0;
  color:var(--ink); padding:.55rem .65rem; border-radius:.55rem; cursor:pointer; font-weight:600;
}
nav.tabs button:hover{background:var(--chip)}
nav.tabs button.on{background:var(--accent); color:var(--accent-ink)}
nav.tabs button .ico{width:1.1rem; text-align:center; opacity:.85}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:.6rem;
  padding:.6rem 1rem; background:color-mix(in srgb, var(--bg-2) 90%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.topbar .spacer{flex:1}
.icon-btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
  width:2.2rem; height:2.2rem; border-radius:.6rem; display:grid; place-items:center; font-size:1rem;
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent)}
.crumb{font-size:.86rem; color:var(--ink-soft); display:flex; align-items:center; gap:.4rem}

.wrap{max-width:var(--maxw); margin:0 auto; padding:1.6rem 1.2rem 6rem; width:100%}
.wrap h1{font-size:1.5rem; margin:.1rem 0 .3rem; letter-spacing:-.01em}
.wrap h2{font-size:1.02rem; margin:1.6rem 0 .6rem}
.sub{color:var(--ink-soft); font-size:.88rem; margin-bottom:1rem}

.card{background:var(--panel); border:1px solid var(--line); border-radius:.85rem; padding:1.1rem 1.2rem; box-shadow:var(--shadow); margin-bottom:1rem}
.card h3{margin:0 0 .5rem; font-size:.98rem}
.card-muted{color:var(--ink-soft); font-size:.85rem}

.datebar{display:flex; align-items:center; gap:.5rem; margin-bottom:1rem}
.datebar b{flex:1; text-align:center; font-size:1rem}

.habitrow{display:flex; align-items:center; gap:.8rem; padding:.85rem .9rem; border:1px solid var(--line); border-radius:.8rem; background:var(--panel); box-shadow:var(--shadow); margin-bottom:.6rem}
.habitrow .chk{width:1.9rem; height:1.9rem; border-radius:50%; border:2px solid var(--line); background:var(--bg-2); cursor:pointer; display:grid; place-items:center; flex:0 0 auto; font-size:1.05rem; color:transparent}
.habitrow .chk.done{background:var(--good); border-color:var(--good); color:#fff}
.habitrow .ico{font-size:1.3rem; flex:0 0 auto}
.habitrow .body{flex:1; min-width:0; cursor:pointer}
.habitrow .name{font-weight:700}
.habitrow.done .name{color:var(--ink-soft)}
.habitrow .streak{font-size:.78rem; color:var(--ink-soft)}
.habitrow .streak b{color:var(--accent)}

.pbar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:.5rem}
.pbar span{display:block; height:100%; background:var(--good)}
.pbar.mid span{background:var(--mid)}
.pct{font-size:.76rem; color:var(--ink-soft); margin-top:.25rem}

.list{display:flex; flex-direction:column; gap:.6rem}
.item-card{background:var(--panel); border:1px solid var(--line); border-radius:.75rem; padding:.9rem 1rem; box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; gap:.7rem}
.item-card:hover{border-color:var(--accent)}
.item-card .ico{font-size:1.3rem}
.item-card .title{font-weight:700; flex:1}
.item-card .meta{color:var(--ink-soft); font-size:.8rem; margin-top:.1rem}
.item-card.archived{opacity:.55}

.addrow{display:flex; gap:.5rem; margin-top:.6rem; flex-wrap:wrap}
.addrow input{flex:1; min-width:6rem; padding:.55rem .7rem; border:1px solid var(--line); border-radius:.55rem; background:var(--bg-2); color:var(--ink)}
.addrow select, .field select{padding:.55rem .7rem; border:1px solid var(--line); border-radius:.55rem; background:var(--bg-2); color:var(--ink)}
.field select{width:100%}
.cathead{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin:1.4rem 0 .6rem; display:flex; align-items:center; gap:.4rem}
.cathead-meta{color:var(--ink-soft); font-weight:600}
.catchips{display:flex; flex-wrap:wrap; gap:.4rem; margin:1rem 0 .3rem}
.chip-toggle{font-size:.78rem; font-weight:600; padding:.3rem .75rem; border-radius:99px; border:1px solid var(--accent); background:var(--chip); color:var(--chip-ink); cursor:pointer}
.chip-toggle.off{opacity:.5; background:none; border-color:var(--line); color:var(--ink-soft)}
.addrow button, .btn{padding:.55rem .9rem; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:.55rem; cursor:pointer; font-weight:600; white-space:nowrap}
.btn.ghost{background:none; color:var(--ink); border-color:var(--line)}
.btn.danger{background:var(--warn); border-color:var(--warn); color:#fff}
.btn.sm{padding:.35rem .6rem; font-size:.82rem}

textarea.notes{width:100%; min-height:9rem; padding:.7rem .8rem; border:1px solid var(--line); border-radius:.6rem; background:var(--bg-2); color:var(--ink); resize:vertical; white-space:pre-wrap; font-size:.92rem; line-height:1.55}
.guide-view{white-space:pre-wrap; font-size:.92rem; line-height:1.6}
.field{margin:.7rem 0}
.field label{display:block; font-size:.8rem; font-weight:700; color:var(--ink-soft); margin-bottom:.3rem; text-transform:uppercase; letter-spacing:.03em}
.field input[type=text], .field input[type=time]{
  width:100%; padding:.55rem .7rem; border:1px solid var(--line); border-radius:.55rem; background:var(--bg-2); color:var(--ink);
}
.icopick{width:3.2rem !important; text-align:center; font-size:1.3rem; flex:0 0 3.2rem !important}

.stats{display:flex; gap:.8rem; flex-wrap:wrap; margin:.3rem 0 1rem}
.stat{background:var(--chip); color:var(--chip-ink); border-radius:.7rem; padding:.6rem .9rem; text-align:center; flex:1; min-width:6rem}
.stat b{display:block; font-size:1.3rem}
.stat span{font-size:.72rem; text-transform:uppercase; letter-spacing:.03em}

.viz-wrap{position:relative; margin-top:.5rem}
.viz-chart{width:100%; height:auto; display:block; overflow:visible}
.viz-grid{stroke:var(--line); stroke-width:1}
.viz-axis{font-size:9px; fill:var(--ink-soft)}
.viz-endlabel{font-size:11px; font-weight:700; fill:var(--ink)}
.viz-rowlabel{font-size:11px; fill:var(--ink)}
.viz-barvalue{font-size:11px; font-weight:700; fill:var(--ink)}
.viz-barvalue-sub{font-size:9px; font-weight:600; fill:var(--ink-soft)}
.viz-hit, .viz-barhit{cursor:pointer}
.viz-crosshair{stroke:var(--ink-soft); stroke-width:1; pointer-events:none}
.viz-hoverdot{fill:var(--panel); stroke:var(--accent); stroke-width:2; pointer-events:none}
.viz-tooltip{
  position:absolute; transform:translate(-50%,-120%); background:var(--ink); color:var(--bg);
  font-size:.76rem; line-height:1.4; padding:.4rem .6rem; border-radius:.4rem; white-space:nowrap;
  pointer-events:none; z-index:5; box-shadow:var(--shadow);
}
.viz-tooltip b{font-size:.86rem}

.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:.35rem; margin-top:.6rem}
.calgrid .dow{text-align:center; font-size:.72rem; color:var(--ink-soft); font-weight:700; text-transform:uppercase}
.calcell{aspect-ratio:1; border:1px solid var(--line); border-radius:.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:var(--panel); font-size:.82rem; gap:.25rem}
.calcell:hover{border-color:var(--accent)}
.calcell.empty{visibility:hidden; cursor:default}
.calcell.today{border-color:var(--accent); border-width:2px}
.calcell .dot{width:.4rem; height:.4rem; border-radius:50%}
.dot.good{background:var(--good)} .dot.mid{background:var(--mid)} .dot.none{background:var(--line)}

.banner{
  display:flex; align-items:center; gap:.6rem; background:var(--mid-bg); color:var(--mid);
  border:1px solid var(--mid); border-radius:.7rem; padding:.65rem .9rem; margin-bottom:1rem; font-size:.88rem;
}
.banner button{background:var(--mid); color:#fff; border:0; border-radius:.4rem; padding:.3rem .7rem; cursor:pointer; font-size:.82rem; font-weight:600}

.empty-state{text-align:center; padding:2.5rem 1rem; color:var(--ink-soft)}

@media(max-width:760px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid !important}
}
.menu-btn{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="logo"></div>
      <div><b>Leo-Ritual</b><small>Daily habit tracker</small></div>
    </div>
    <nav class="tabs" id="navtabs"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Menu">≡</button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var KEY = "leoRitualDB_v1";
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10 ? "0"+n : ""+n; }
function dstr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function addDays(dateStr, n){
  var p=dateStr.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return dstr(d);
}
function fmtDate(s){
  var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
}

var DEFAULT_CATEGORIES = [
  {id:"physical", label:"Physical", icon:"💪", order:0, colorSlot:0},
  {id:"mental", label:"Mental", icon:"🧘", order:1, colorSlot:1},
  {id:"official", label:"Official", icon:"💼", order:2, colorSlot:2},
  {id:"personal", label:"Personal", icon:"🏡", order:3, colorSlot:3},
  {id:"financial", label:"Financial", icon:"💰", order:4, colorSlot:4}
];
function cats(){ return DB.categories.slice().sort(function(a,b){return a.order-b.order;}); }
function nextFreeColorSlot(categories){
  var used={};
  categories.forEach(function(c){ if(typeof c.colorSlot==="number") used[c.colorSlot]=true; });
  for(var i=0;i<8;i++){ if(!used[i]) return i; }
  return Math.floor(Math.random()*8);
}

var GUIDES = {
  exercise:
"Move your body for at least 20–30 minutes, most days of the week.\n\n"+
"• Mix it up: some cardio (walk, jog, cycle, swim) + some strength/gym work across the week.\n"+
"• Warm up 3–5 min before, cool down / stretch 3–5 min after.\n"+
"• Consistency beats intensity — a brisk 20-minute walk daily beats an occasional hard workout.\n"+
"• Progress gradually: add a little more time, weight, or reps every 1–2 weeks.\n"+
"• Sharp pain means stop; mild muscle fatigue the next day is normal.\n"+
"• Stay hydrated and get enough protein + sleep to recover.",

  breathing:
"A simple daily breathing practice, 5–10 minutes, ideally on an empty stomach.\n\n"+
"Basic technique — Deep Diaphragmatic Breathing:\n"+
"1. Sit comfortably, spine straight, shoulders relaxed.\n"+
"2. Inhale slowly through the nose for a count of 4, letting the belly expand (not the chest).\n"+
"3. Hold gently for a count of 4.\n"+
"4. Exhale slowly through the nose or mouth for a count of 6–8.\n"+
"5. Repeat for 10–15 rounds.\n\n"+
"Optional — Nadi Shodhana (Alternate Nostril Breathing):\n"+
"1. Close the right nostril with the thumb, inhale left for 4 counts.\n"+
"2. Close the left nostril with the ring finger, release the right, exhale right for 4 counts.\n"+
"3. Inhale right for 4, close right, exhale left for 4. That's one round — repeat 5–10 rounds.\n\n"+
"Optional pairing — Mantra / Chanting:\n"+
"Once breathing settles, add a soft repeated mantra (e.g. \"Om\", or any word that centers you) timed to the "+
"exhale for a few rounds — it deepens the calming effect and eases the mind into stillness.\n\n"+
"• Never force the breath or hold until uncomfortable.\n"+
"• Keep the exhale longer than or equal to the inhale to engage the calming response.\n"+
"• Good before exercise, before meditation, or anytime you feel stressed.",

  twinheart:
"Master Choa Kok Sui's Meditation on Twin Hearts — a loving-kindness meditation that blesses the earth while "+
"activating the heart and crown chakras. ~15–20 minutes, seated with spine straight, eyes closed.\n\n"+
"General flow:\n"+
"1. Invocation — ask for divine guidance and blessing before beginning.\n"+
"2. Blessing the Earth — silently radiate loving-kindness to loved ones, strangers, and those you find "+
"difficult, extending it to your city, country, and the whole planet.\n"+
"3. Activate heart and crown — with each blessing, feel love radiating from the heart chakra (center of chest) "+
"while energy flows through the crown chakra (top of head) like a fountain of light.\n"+
"4. Cosmic cleansing — visualize the earth and all beings on it being cleansed and healed by the energy radiated.\n"+
"5. Cosmic blessing / stillness — after the active blessing, sit in silent stillness for a few minutes.\n"+
"6. Release excess energy — ground any leftover energy by blessing the earth once more, then gently open your eyes.\n\n"+
"Optional pairing — Forgiveness / Loving-Kindness:\n"+
"Before or during step 2, silently name one person you're holding onto resentment toward and consciously "+
"forgive them (for your own peace, not approval of what happened) before extending the blessing further — "+
"this is where the practice does its deepest work.\n\n"+
"• A service-oriented meditation — the more you give, the more comes back.\n"+
"• Drink extra water afterward; the practice can bring up a lot of energy.\n"+
"• This is a quick-reference summary — see the full Pranic Healing book/audio for the complete guided steps.",

  oilpulling:
"An Ayurvedic oral-care routine: oil pulling once in the morning, plus brushing twice a day.\n\n"+
"Oil pulling — first thing in the morning, before brushing or drinking anything:\n"+
"1. Take 1 tablespoon of cold-pressed coconut or sesame oil (start with 1 tsp if you're new to it).\n"+
"2. Swish gently around the mouth and through the teeth for 15–20 minutes — do NOT gargle or swallow. The oil "+
"will thin and turn milky white as it mixes with saliva.\n"+
"3. Spit the oil into a trash can or tissue, not the sink or toilet (it can solidify and clog pipes over time).\n"+
"4. Rinse your mouth well with warm water (a salt-water rinse works well too).\n\n"+
"Brushing — twice a day:\n"+
"5. Brush right after the oil-pulling rinse in the morning, and again before bed at night.\n"+
"6. Two minutes each time, soft-bristle brush, don't forget the tongue.\n\n"+
"• Do oil pulling daily on an empty stomach for best results.\n"+
"• Never swallow the oil — it has pulled bacteria and toxins out of the mouth.\n"+
"• If 15–20 minutes feels too long at first, build up gradually from 5 minutes.\n"+
"• Reported benefits: fresher breath, whiter teeth, healthier gums.",

  water:
"A full glass of water (300–500ml) first thing on waking, before tea, coffee, or food.\n\n"+
"• Keep a glass or bottle by your bed so it's the first thing you see.\n"+
"• Room-temperature or warm water is gentler on an empty stomach than ice-cold.\n"+
"• This is just the first, easiest win of the day — not your whole day's hydration target.",

  coldshower:
"End your normal shower with 30–60 seconds of cold water.\n\n"+
"• Breathe slowly and steadily through it — don't gasp-breathe.\n"+
"• New to it? Start with 15 seconds and build up over a few weeks.\n"+
"• Skip it on sick days, or if you have a heart condition — check with a doctor first.\n"+
"• Reported benefits: alertness, mood lift, stress resilience.",

  gratitude:
"Write down 3 things you're grateful for, with one short line on why each mattered. Morning or night, "+
"whichever you'll actually keep doing — 5 minutes, max.\n\n"+
"Sample entry:\n"+
"1. Had a good phone call with my brother — felt connected.\n"+
"2. Finished a task I'd been avoiding — relief and pride.\n"+
"3. Enjoyed my morning coffee in silence — small, but real.\n\n"+
"• Be specific — \"my health\" is weaker than \"woke up with no body aches today\".\n"+
"• Mix people, moments, and small sensory things, not just big wins.\n"+
"• Keep it under 5 minutes — this is a daily habit, not an essay.",

  reading:
"20–30 minutes daily, ideally a physical book over a screen.\n\n"+
"• Keep a book by your bed or desk so starting takes zero friction.\n"+
"• Fiction or non-fiction both count — the goal is the habit, not the genre.\n"+
"• Track pages loosely, not strictly — consistency matters more than pace.\n"+
"• If motivation dips, switch books rather than forcing through one you're not enjoying.",

  priorities:
"Each morning (or the night before), write the 3 things that would make today a win — not a 10-item to-do list.\n\n"+
"Sample:\n"+
"1. Finish the Q3 report draft\n"+
"2. Reply to the 3 blocked emails\n"+
"3. 30-min 1:1 prep for Thursday\n\n"+
"• If you only get 1 of 3 done, you still made progress on what actually mattered.\n"+
"• Keep it to 3 — a longer list is a to-do list, not a priority list.",

  deepwork:
"One block of 60–90 minutes, single task, phone in another room, notifications off.\n\n"+
"• Pick the task before the block starts — don't decide mid-block.\n"+
"• Protect it on your calendar like a meeting.\n"+
"• A short walk or stretch right after helps it not bleed into burnout.",

  shutdown:
"A 5–10 minute ritual to close out work deliberately instead of trailing off.\n\n"+
"• Review what got done vs. today's top-3 priorities.\n"+
"• Write tomorrow's first task so you're not starting cold.\n"+
"• Close tabs/apps — a visual \"done\" signal matters.\n"+
"• Say or write one line: \"Shutdown complete.\"",

  learn:
"10–15 minutes daily on something outside your current task list — an article, a course module, a new tool feature.\n\n"+
"• Keep a running list of things you're curious about so you never start from zero.\n"+
"• Note one sentence on what you learned — it cements it and gives you a trail to look back on.",

  sleep:
"Same wake time every day (including weekends, within ~1 hour), 7–8 hours of sleep.\n\n"+
"• Anchor the wake time first — bedtime naturally follows once wake time is fixed.\n"+
"• Morning sunlight shortly after waking reinforces this rhythm.\n"+
"• Missed a night? Don't \"catch up\" by sleeping in — get back to the same wake time the next day.",

  winddown:
"No phone, laptop, or TV for the last 30–60 minutes before bed.\n\n"+
"• Read, stretch, or journal instead.\n"+
"• Keep the phone charging outside the bedroom if possible.\n"+
"• Dim the lights in this window — it signals your body it's time to wind down.",

  connect:
"A call, message, or short visit with someone who matters — daily or a few times a week.\n\n"+
"• Doesn't need to be long — 5–10 minutes of real attention counts.\n"+
"• Put your phone face-down and actually listen if it's a call.\n"+
"• Rotate who you reach out to so it doesn't always default to the same person.",

  declutter:
"5 minutes, one small area — a drawer, your desk, one shelf.\n\n"+
"• Pick a different spot each day so it doesn't become a big weekend project.\n"+
"• \"One in, one out\" for anything you're tempted to keep \"just in case\".\n"+
"• Don't aim for perfect — aim for a little better than yesterday.",

  reviewPortfolio:
"Check in on at least one stock or investment holding today — a quick portfolio glance, not a trading session.\n\n"+
"• Look at 1 holding in some depth: price movement, any news, how it fits your original thesis.\n"+
"• This is about staying informed, not reacting — avoid impulse buy/sell decisions from a single day's move.\n"+
"• Rotate which holding you review so everything gets attention over a few weeks.\n"+
"• If you use a brokerage app, a 2-minute look at holdings + today's P&L is enough.",

  financeTracking:
"Track today's money movement — income, expenses, transfers — so you always know where you stand.\n\n"+
"• Log it as it happens, not from memory at night.\n"+
"• A simple app (like Leo-Finance), spreadsheet, or notes app all work — pick whichever you'll actually keep using.\n"+
"• The goal is visibility, not restriction — see where money goes before deciding to change anything.",

  savings:
"Move something toward savings or investments before the day's spending happens — pay yourself first.\n\n"+
"• Even a small, consistent amount beats an occasional large one.\n"+
"• Automate where you can (SIP, recurring transfer) so it doesn't depend on willpower each day.\n"+
"• Nothing to spare today? That's fine — the check-in itself keeps the habit alive.",

  readInvestment:
"Spend 10–15 minutes reading or learning something about investing — an article, a book chapter, market commentary.\n\n"+
"• Mix sources: fundamentals (how to read a balance sheet), macro news, and your own holdings' sector.\n"+

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return seed();
    var d = JSON.parse(raw);
    if(!d.settings) d.settings={theme:"day", reminders:{enabled:false,time:"06:30"}, lastFired:{}, hiddenCategories:[], lastExportAt:null, exportSnoozedUntil:null};
    if(!d.settings.reminders) d.settings.reminders={enabled:false,time:"06:30"};
    if(!d.settings.lastFired) d.settings.lastFired={};
    if(!d.settings.hiddenCategories) d.settings.hiddenCategories=[];
    if(!("lastExportAt" in d.settings)) d.settings.lastExportAt=null;
    if(!("exportSnoozedUntil" in d.settings)) d.settings.exportSnoozedUntil=null;
    if(!d.logs) d.logs={};
    if(!d.categories || !d.categories.length) d.categories = DEFAULT_CATEGORIES.map(function(c){ return {id:c.id, label:c.label, icon:c.icon, order:c.order, colorSlot:c.colorSlot}; });
    (d.habits||[]).forEach(function(h){ if(!h.category) h.category="personal"; });
    d.categories.forEach(function(c){ if(typeof c.colorSlot!=="number") c.colorSlot=nextFreeColorSlot(d.categories); });
    if(!d.categories.some(function(c){ return c.id==="financial"; })){
      var maxCatOrder=d.categories.reduce(function(m,c){return Math.max(m,c.order);},-1);
      d.categories.push({id:"financial", label:"Financial", icon:"💰", order:maxCatOrder+1, colorSlot:nextFreeColorSlot(d.categories)});
      var maxOrder=(d.habits||[]).reduce(function(m,h){return Math.max(m,h.order);},-1);
      var nd=todayStr();
      d.habits.push(
        {id:uid(), name:"Review Portfolio", icon:"📈", guide:GUIDES.reviewPortfolio, category:"financial", archived:false, order:maxOrder+1, createdAt:nd},
        {id:uid(), name:"Finance Tracking", icon:"🧾", guide:GUIDES.financeTracking, category:"financial", archived:false, order:maxOrder+2, createdAt:nd},
        {id:uid(), name:"Savings", icon:"🏦", guide:GUIDES.savings, category:"financial", archived:false, order:maxOrder+3, createdAt:nd},
        {id:uid(), name:"Read About Investments", icon:"📚", guide:GUIDES.readInvestment, category:"financial", archived:false, order:maxOrder+4, createdAt:nd}
      );

/* ---------- data helpers ---------- */
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function indexOfId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return i; return -1; }
function activeHabits(){ return DB.habits.filter(function(h){return !h.archived;}).sort(function(a,b){return a.order-b.order;}); }
function groupByCategory(list){
  var categories = cats();
  var out={};
  categories.forEach(function(c){ out[c.id]=[]; });
  var fallbackId = categories.length ? categories[0].id : null;
  list.forEach(function(h){
    var bucket = out[h.category] ? h.category : fallbackId;
    if(bucket) out[bucket].push(h);
  });
  categories.forEach(function(c){ out[c.id].sort(function(a,b){return a.order-b.order;}); });
  return out;
}
function logFor(date){ return DB.logs[date] || []; }
function isDone(date, habitId){ return logFor(date).indexOf(habitId) >= 0; }
function toggleDone(date, habitId){
  var arr = DB.logs[date] || (DB.logs[date]=[]);
  var i = arr.indexOf(habitId);
  if(i>=0) arr.splice(i,1); else arr.push(habitId);
  if(arr.length===0) delete DB.logs[date];
  save();
}
function currentStreak(habitId){
  var d = todayStr();
  if(!isDone(d, habitId)) d = addDays(d, -1);
  var count=0;
  while(isDone(d, habitId)){ count++; d = addDays(d, -1); }
  return count;
}
function longestStreak(habitId){
  var dates = Object.keys(DB.logs).filter(function(k){ return DB.logs[k].indexOf(habitId)>=0; }).sort();
  var best=0, run=0, prev=null;
  dates.forEach(function(d){
    if(prev && addDays(prev,1)===d) run++; else run=1;
    if(run>best) best=run;
    prev=d;
  });
  return best;
}
function totalCount(habitId){
  var n=0; for(var k in DB.logs) if(DB.logs[k].indexOf(habitId)>=0) n++; return n;
}
function dayCompletion(date){
  var habits = activeHabits();
  if(!habits.length) return null;
  var done = habits.filter(function(h){ return isDone(date,h.id); }).length;
  return {done:done, total:habits.length};
}
function categoryStreak(catId){
  var list = activeHabits().filter(function(h){ return h.category===catId; });
  if(!list.length) return 0;
  function allDone(date){ return list.every(function(h){ return isDone(date,h.id); }); }
  var d = todayStr();
  if(!allDone(d)) d = addDays(d,-1);
  var count=0;
  while(allDone(d)){ count++; d = addDays(d,-1); }
  return count;
}
function categoryCompletionPct(catId, days){
  var list = activeHabits().filter(function(h){ return h.category===catId; });
  if(!list.length) return null;
  var doneSum=0, total=0;
  for(var i=0;i<days;i++){
    var d = addDays(todayStr(), -i);
    list.forEach(function(h){ total++; if(isDone(d,h.id)) doneSum++; });
  }
  return Math.round(100*doneSum/total);
}
function overallCompletionPct(days){
  var list = activeHabits();
  if(!list.length) return null;
  var doneSum=0, total=0;
  for(var i=0;i<days;i++){
    var d = addDays(todayStr(), -i);
    list.forEach(function(h){ total++; if(isDone(d,h.id)) doneSum++; });
  }
  return Math.round(100*doneSum/total);
}
function dailyCompletionSeries(days){
  var list = activeHabits();
  var out = [];
  for(var i=days-1; i>=0; i--){
    var d = addDays(todayStr(), -i);
    var pct = null;
    if(list.length){
      var done = list.filter(function(h){ return isDone(d,h.id); }).length;
      pct = Math.round(100*done/list.length);
    }
    out.push({date:d, pct:pct});
  }
  return out;
}
function fmtShort(s){
  var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function daysBetween(a,b){
  var pa=a.split("-"), pb=b.split("-");
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]);
  var db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function shouldShowExportBanner(){
  if(!Object.keys(DB.logs).length) return false;
  var snoozed=DB.settings.exportSnoozedUntil;
  if(snoozed && todayStr()<snoozed) return false;
  if(!DB.settings.lastExportAt) return true;
  return daysBetween(DB.settings.lastExportAt, todayStr())>=14;
}
function exportBannerHtml(){

function viewToday(date){
  var habits = activeHabits();

  var h = '<div class="datebar"><button class="icon-btn" data-act="dayPrev">‹</button><b>'+fmtDate(date)+'</b><button class="icon-btn" data-act="dayNext" '+(date>=todayStr()?'style="visibility:hidden"':'')+'>›</button></div>';

    h += '<div class="empty-state">No habits yet. <a href="#" data-act="goHabits">Add your first habit</a>.</div>';
    return h;
  }

  h += exportBannerHtml();

  if(comp){
    var pct = Math.round(100*comp.done/comp.total);
    h += '<div class="card"><div class="pct">'+comp.done+' of '+comp.total+' habits done'+(pct===100?" — nice work! 🎉":"")+'</div>';
    h += '<div class="pbar '+(pct<100?"mid":"")+'"><span style="width:'+pct+'%"></span></div></div>';
  }

  var grouped = groupByCategory(habits);
  var categories = cats();

  h += '<div class="catchips">';
  categories.forEach(function(cat){
    var list = grouped[cat.id];
    if(!list.length) return;
    var hidden = DB.settings.hiddenCategories.indexOf(cat.id)>=0;
    h += '<button class="chip-toggle '+(hidden?"off":"")+'" data-act="toggleCatFilter" data-cat="'+cat.id+'">'+cat.icon+' '+esc(cat.label)+'</button>';
  });
  h += '</div>';

  categories.forEach(function(cat){
    var list = grouped[cat.id];
    if(!list.length) return;
    if(DB.settings.hiddenCategories.indexOf(cat.id)>=0) return;
    var doneInCat = list.filter(function(hb){ return isDone(date,hb.id); }).length;
    var catSt = categoryStreak(cat.id);
    h += '<div class="cathead">'+cat.icon+' '+esc(cat.label)+' <span class="cathead-meta">'+doneInCat+'/'+list.length+(catSt>0?' · 🔥 '+catSt:'')+'</span></div>';
    h += '<div class="list">';
    list.forEach(function(hb){
      var done = isDone(date, hb.id);
      var st = currentStreak(hb.id);
      h += '<div class="habitrow '+(done?"done":"")+'">';
      h += '<div class="chk '+(done?"done":"")+'" data-act="toggleHabit" data-id="'+hb.id+'">✓</div>';
      h += '<div class="ico">'+hb.icon+'</div>';
      h += '<div class="body" data-act="openHabit" data-id="'+hb.id+'"><div class="name">'+esc(hb.name)+'</div>';
      h += '<div class="streak">'+(st>0 ? '<b>🔥 '+st+'-day streak</b>' : 'No current streak')+'</div></div>';
      h += '</div>';
    });
    h += '</div>';
  });
  return h;
}

function vizIsDark(){ return document.documentElement.getAttribute("data-theme")==="dark"; }
function vizHash(s){ var hh=0; for(var i=0;i<s.length;i++){ hh=(hh*31+s.charCodeAt(i))>>>0; } return hh; }
function catColor(cat){

function trendChartSvg(series){
  var W=640, H=180, padL=30, padR=12, padT=14, padB=24;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var n=series.length;
  function x(i){ return padL + (n<=1?0:(plotW*i/(n-1))); }
  function y(v){ return padT + plotH - (plotH*Math.max(0,Math.min(100,v))/100); }
  var seq=vizSeqColor();

  var grid="";
  [0,50,100].forEach(function(v){
    var gy=y(v);
    grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" class="viz-grid"/>';
    grid += '<text x="'+(padL-6)+'" y="'+(gy+3)+'" text-anchor="end" class="viz-axis">'+v+'</text>';
  });

  var pts=[];
  for(var i=0;i<n;i++) pts.push(x(i)+","+y(series[i].pct==null?0:series[i].pct));
  var linePath="M"+pts.join(" L");
  var areaPath=linePath+" L"+x(n-1)+","+(padT+plotH)+" L"+x(0)+","+(padT+plotH)+" Z";

  var lastPct=series[n-1].pct==null?0:series[n-1].pct;
  var lastX=x(n-1), lastY=y(lastPct);

  var labelIdx = n>1 ? [0, Math.floor((n-1)/2), n-1] : [0];
  var xlabels="";
  labelIdx.forEach(function(i){
    var anchor = i===0 ? "start" : (i===n-1 ? "end" : "middle");
    xlabels += '<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+anchor+'" class="viz-axis">'+fmtShort(series[i].date)+'</text>';
  });

  var hw = n>1 ? plotW/(n-1) : plotW;
  var hitRects="";
  for(var j=0;j<n;j++){
    var cx=x(j), cy=y(series[j].pct==null?0:series[j].pct);
    hitRects += '<rect class="viz-hit" data-cx="'+cx+'" data-cy="'+cy+'" data-date="'+series[j].date+'" data-pct="'+(series[j].pct==null?0:series[j].pct)+'" x="'+(cx-hw/2)+'" y="'+padT+'" width="'+hw+'" height="'+plotH+'" fill="transparent"/>';
  }

  return '<div class="viz-wrap">'+
    '<svg class="viz-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      grid+
      '<path d="'+areaPath+'" fill="'+seq+'" opacity="0.1" stroke="none"/>'+
      '<path d="'+linePath+'" fill="none" stroke="'+seq+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+lastX+'" cy="'+lastY+'" r="4" fill="'+seq+'" stroke="var(--panel)" stroke-width="2"/>'+
      '<text x="'+(lastX-6)+'" y="'+(lastY<24?lastY+16:lastY-8)+'" text-anchor="end" class="viz-endlabel">'+lastPct+'%</text>'+
      xlabels+
      hitRects+
      '<line class="viz-crosshair" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+plotH)+'" style="display:none"/>'+
      '<circle class="viz-hoverdot" r="4" style="display:none"/>'+
    '</svg>'+
    '<div class="viz-tooltip" style="display:none"></div>'+
  '</div>';
}

function categoryBarChartSvg(rows){
  var W=640, rowH=38, padT=4, padB=4, padL=4;
  var barX=132, rightW=150, barMaxW=W-barX-rightW;
  var n=rows.length;
  var H=padT+padB+n*rowH;

  var body="";
  rows.forEach(function(r,i){
    var cy=padT+i*rowH+rowH/2;
    var bw=Math.max(barMaxW*Math.max(0,Math.min(100,r.pct7))/100, 3);
    var by=cy-9;
    var color=catColor(r.cat);
    body += '<text x="'+padL+'" y="'+(cy+4)+'" class="viz-rowlabel">'+esc(r.cat.icon)+' '+esc(r.cat.label)+'</text>';
    body += '<rect x="'+barX+'" y="'+by+'" width="'+bw+'" height="18" rx="4" fill="'+color+'"/>';
    body += '<text x="'+(barX+bw+8)+'" y="'+(cy+4)+'"><tspan class="viz-barvalue">'+r.pct7+'%</tspan><tspan class="viz-barvalue-sub" dx="5">· 30d '+r.pct30+'%</tspan></text>';
    body += '<rect class="viz-barhit" data-i="'+i+'" data-label="'+esc(r.cat.icon)+' '+esc(r.cat.label)+'" data-pct7="'+r.pct7+'" data-pct30="'+r.pct30+'" data-streak="'+r.streak+'" x="0" y="'+(padT+i*rowH)+'" width="'+W+'" height="'+rowH+'" fill="transparent"/>';
  });

  return '<div class="viz-wrap">'+
    '<svg class="viz-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+body+'</svg>'+
    '<div class="viz-tooltip" style="display:none"></div>'+
  '</div>';
}

function initReviewInteractions(){
  var wraps = document.querySelectorAll('#view .viz-wrap');
  wraps.forEach(function(wrap){
    var svg = wrap.querySelector('.viz-chart');
    var tooltip = wrap.querySelector('.viz-tooltip');
    if(!svg) return;
    var vb = svg.viewBox.baseVal;
    var crosshair = svg.querySelector('.viz-crosshair');

    if(crosshair){
      svg.querySelectorAll('.viz-hit').forEach(function(hit){
        function show(){
          var cx=+hit.getAttribute('data-cx'), cy=+hit.getAttribute('data-cy');
          crosshair.setAttribute('x1',cx); crosshair.setAttribute('x2',cx); crosshair.style.display='';
          var dot=svg.querySelector('.viz-hoverdot');
          dot.setAttribute('cx',cx); dot.setAttribute('cy',cy); dot.style.display='';
          tooltip.innerHTML='';
          var b=document.createElement('b'); b.textContent=hit.getAttribute('data-pct')+'%';
          var sp=document.createElement('span'); sp.textContent=' · '+fmtShort(hit.getAttribute('data-date'));
          tooltip.appendChild(b); tooltip.appendChild(sp);
          tooltip.style.left=(cx/vb.width*100)+'%';
          tooltip.style.top=(cy/vb.height*100)+'%';
          tooltip.style.display='';
        }
        hit.addEventListener('pointerenter', show);
        hit.addEventListener('pointermove', show);
        hit.addEventListener('pointerleave', function(){
          crosshair.style.display='none';
          svg.querySelector('.viz-hoverdot').style.display='none';
          tooltip.style.display='none';
        });
      });
    } else {
      svg.querySelectorAll('.viz-barhit').forEach(function(hit){
        var streak=+hit.getAttribute('data-streak');
        if(!streak) return; // 7d/30d are already direct-labeled; a tooltip with nothing new just gates
        function show(){
          var r=hit.getBBox();
          tooltip.innerHTML='';
          var b=document.createElement('b'); b.textContent='🔥 '+streak+'-day streak';
          tooltip.appendChild(b);
          tooltip.style.left=((r.x+r.width/2)/vb.width*100)+'%';
          tooltip.style.top=((r.y)/vb.height*100)+'%';
          tooltip.style.display='';
        }
        hit.addEventListener('pointerenter', show);
        hit.addEventListener('pointerleave', function(){ tooltip.style.display='none'; });
      });
    }
  });
}

/* ---------- Review ---------- */
function viewReview(){
  var h='<h1>Review</h1><div class="sub">Completion trends over the last 7 and 30 days.</div>';
  var o7=overallCompletionPct(7), o30=overallCompletionPct(30);
  if(o7===null) return h+'<div class="empty-state">No habits yet.</div>';

  h+='<div class="stats">';
  h+='<div class="stat"><b>'+o7+'%</b><span>Overall, last 7 days</span></div>';
  h+='<div class="stat"><b>'+o30+'%</b><span>Overall, last 30 days</span></div>';
  h+='</div>';

  h+='<div class="card"><h3>Daily completion — last 14 days</h3>';
  h+=trendChartSvg(dailyCompletionSeries(14));
  h+='</div>';

  var rows = cats().map(function(cat){
    var list = activeHabits().filter(function(hb){ return hb.category===cat.id; });
    if(!list.length) return null;
    return {cat:cat, pct7:categoryCompletionPct(cat.id,7), pct30:categoryCompletionPct(cat.id,30), streak:categoryStreak(cat.id)};
  }).filter(function(r){ return r; });

  if(rows.length){
    h+='<div class="card"><h3>Category completion — last 7 days</h3>';
    h+='<div class="card-muted" style="margin-bottom:.3rem">Hover a row with a streak to see it.</div>';
    h+=categoryBarChartSvg(rows);
    h+='</div>';
  }
  return h;
}

/* ---------- actions ---------- */
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var act=el.getAttribute("data-act");
  var id=el.getAttribute("data-id");
  var date=el.getAttribute("data-date");

  switch(act){
    case "dayPrev": navigate("today",{date:addDays(state.params.date,-1)}); return;
    case "dayNext": navigate("today",{date:addDays(state.params.date,1)}); return;
    case "toggleHabit": toggleDone(state.params.date, id); render(); return;
    case "openHabit": navigate("habitDetail",{id:id}); return;
    case "goHabits": e.preventDefault(); navigate("habits"); return;

    case "addHabit": {
      var icoEl=document.getElementById("newIcon"), nameEl=document.getElementById("newName"), catEl=document.getElementById("newCategory");
      var name=nameEl.value.trim(); var ico=icoEl.value.trim()||"✅"; var cat=catEl.value||"personal";
      if(name){
        var maxOrder=DB.habits.reduce(function(m,h){return Math.max(m,h.order);},-1);
        DB.habits.push({id:uid(), name:name, icon:ico, guide:"", category:cat, archived:false, order:maxOrder+1, createdAt:todayStr()});
        save(); navigate("habits");
      }
      return;
    }
    case "archiveHabit": { var hb=byId(DB.habits,id); hb.archived=!hb.archived; save(); render(); return; }
    case "deleteHabit": {
      if(confirm("Delete this habit and all its history? This cannot be undone.")){
        DB.habits=DB.habits.filter(function(h){return h.id!==id;});
        for(var k in DB.logs){ var i=DB.logs[k].indexOf(id); if(i>=0){ DB.logs[k].splice(i,1); if(!DB.logs[k].length) delete DB.logs[k]; } }
        save(); navigate("habits");
      }
      return;
    }

    case "openDay": navigate("today",{date:date}); return;
    case "calPrev": state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()-1,1); render(); return;
    case "calNext": state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+1,1); render(); return;
    case "hCalPrev": state.habitCalMonth=new Date(state.habitCalMonth.getFullYear(),state.habitCalMonth.getMonth()-1,1); render(); return;
    case "hCalNext": state.habitCalMonth=new Date(state.habitCalMonth.getFullYear(),state.habitCalMonth.getMonth()+1,1); render(); return;

    case "toggleCatFilter": {
      var cid=el.getAttribute("data-cat");
      var hc=DB.settings.hiddenCategories;
      var hi=hc.indexOf(cid);
      if(hi>=0) hc.splice(hi,1); else hc.push(cid);
      save(); render();
      return;
    }

    case "catUp": {
      var listUp=cats(); var idxUp=indexOfId(listUp,id);
      if(idxUp>0){ var tmpU=listUp[idxUp].order; listUp[idxUp].order=listUp[idxUp-1].order; listUp[idxUp-1].order=tmpU; save(); render(); }
      return;
    }
    case "catDown": {
      var listDn=cats(); var idxDn=indexOfId(listDn,id);
      if(idxDn<listDn.length-1){ var tmpD=listDn[idxDn].order; listDn[idxDn].order=listDn[idxDn+1].order; listDn[idxDn+1].order=tmpD; save(); render(); }
      return;
    }
    case "deleteCat": {
      var allCats=cats();
      if(allCats.length<=1){ alert("You need at least one category."); return; }
      var cat=byId(DB.categories,id);
      var affected=DB.habits.filter(function(hh){return hh.category===id;});
      var fallback=allCats.filter(function(c){return c.id!==id;})[0];
      var msg = affected.length
        ? 'Delete "'+cat.label+'"? '+affected.length+' habit(s) will move to "'+fallback.label+'". This cannot be undone.'
        : 'Delete the "'+cat.label+'" category?';
      if(confirm(msg)){
        affected.forEach(function(hh){ hh.category=fallback.id; });
        DB.categories=DB.categories.filter(function(c){return c.id!==id;});
        var hcx=DB.settings.hiddenCategories; var hix=hcx.indexOf(id); if(hix>=0) hcx.splice(hix,1);
        save(); render();
      }
      return;
    }
    case "addCategory": {
      var icoCEl=document.getElementById("newCatIcon"), labelEl=document.getElementById("newCatLabel");
      var label=labelEl.value.trim(); var icoC=icoCEl.value.trim()||"🏷️";
      if(label){
        var maxCatOrder=DB.categories.reduce(function(m,c){return Math.max(m,c.order);},-1);
        DB.categories.push({id:"cat"+uid(), label:label, icon:icoC, order:maxCatOrder+1, colorSlot:nextFreeColorSlot(DB.categories)});
        save(); render();
      }
      return;
    }

    case "toggleReminders": DB.settings.reminders.enabled=document.getElementById("remEnabled").checked; save(); render(); return;
    case "themeToggle": {
      var html=document.documentElement;
      var cur=html.getAttribute("data-theme");
      html.setAttribute("data-theme", cur==="dark"?"day":"dark");
      DB.settings.theme=html.getAttribute("data-theme"); save(); render();
      return;
    }
    case "exportData": {
      var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="leo-ritual-backup-"+todayStr()+".json"; a.click();
      DB.settings.lastExportAt=todayStr(); DB.settings.exportSnoozedUntil=null; save(); render();
      return;
    }
    case "snoozeExport": {
      DB.settings.exportSnoozedUntil=addDays(todayStr(),7); save(); render();
      return;
    }
    case "clearAll": {
      if(confirm("This deletes ALL Leo-Ritual data on this device. This cannot be undone. Continue?")){
        localStorage.removeItem(KEY); DB=seed(); save(); navigate("today",{date:todayStr()});
      }
      return;
    }
    case "back": navigate(el.getAttribute("data-view")); return;
  }
});

document.addEventListener("change", function(e){
  var el=e.target;
  var act=el.getAttribute("data-act");
  if(!act) return;
  var id=el.getAttribute("data-id");
  switch(act){
    case "setRemTime": DB.settings.reminders.time=el.value; save(); return;
    case "editCategory": byId(DB.habits,id).category=el.value; save(); render(); return;
    case "importData": {
      var f=el.files[0]; if(!f) return;
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var d=JSON.parse(reader.result);
          if(confirm("Replace all current data with the imported file?")){ DB=d; save(); navigate("today",{date:todayStr()}); }
        }catch(err){ alert("Invalid JSON file."); }
      };
      reader.readAsText(f);
      return;
    }
  }
});

document.addEventListener("input", function(e){
  var el=e.target;
  var act=el.getAttribute("data-act");
  if(!act) return;
  var id=el.getAttribute("data-id");
  switch(act){
    case "editName": byId(DB.habits,id).name=el.value; save(); return;
    case "editIcon": byId(DB.habits,id).icon=el.value; save(); return;
    case "editGuide": byId(DB.habits,id).guide=el.value; save(); return;
    case "editCatIcon": byId(DB.categories,id).icon=el.value; save(); return;
    case "editCatLabel": byId(DB.categories,id).label=el.value; save(); return;
  }
});
/* re-render crumb/sidebar labels after name/icon edits lose focus, without losing cursor mid-type */
document.addEventListener("blur", function(e){
  var act=e.target.getAttribute && e.target.getAttribute("data-act");
  if(act==="editName" || act==="editIcon" || act==="editCatIcon" || act==="editCatLabel") render();
}, true);

/* nav clicks */
document.getElementById("navtabs").addEventListener("click", function(e){
  var b=e.target.closest("[data-nav]");
  if(!b) return;
  var v=b.getAttribute("data-nav");
  if(v==="today") navigate("today",{date:todayStr()});
  else navigate(v);
});
document.getElementById("menuBtn").addEventListener("click", function(){
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("themeBtn").addEventListener("click", function(){
  var html=document.documentElement;
  var cur=html.getAttribute("data-theme");
  html.setAttribute("data-theme", cur==="dark"?"day":"dark");
  DB.settings.theme=html.getAttribute("data-theme"); save(); render();
});
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter") return;
  if(e.target.id==="newName"){ document.querySelector('[data-act="addHabit"]').click(); }
});

/* ---------- reminder (while tab open) ---------- */
function checkReminder(){
  var r=DB.settings.reminders;
  if(!r.enabled) return;
  if(typeof Notification!=="undefined" && Notification.permission==="default"){
    Notification.requestPermission();
  }
  var now=new Date(); var hhmm=pad(now.getHours())+":"+pad(now.getMinutes());
  var key=todayStr();
  var comp=dayCompletion(todayStr());
  if(hhmm===r.time && comp && comp.done<comp.total && DB.settings.lastFired[key]!==true){
    DB.settings.lastFired[key]=true; save();
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      try{ new Notification("Morning ritual", {body:"You still have habits to complete today in Leo-Ritual.", icon:"icon-192.png"}); }catch(e){}
    }
  }
}
setInterval(checkReminder, 60000);

/* ---------- init ---------- */
document.documentElement.setAttribute("data-theme", DB.settings.theme==="dark" ? "dark" : "day");
navigate("today",{date:todayStr()});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
